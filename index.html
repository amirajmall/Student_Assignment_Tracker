<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Assignment Tracker | Login</title>

  // Tailwind CSS
  <link rel="stylesheet" href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-gray-900 to-gray-800 px-4">

  // login
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
   
    <div class="flex justify-center mb-4">
      <div class="h-12 w-12 flex items-center justify-center rounded-lg bg-gray-900 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2 2a2 2 0 0 1 2-2h9a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a2 2 0 0 1-2-2z"/>
          <path d="M4 1h9v12H4z"/>
        </svg>
      </div>
    </div>

    // title
    <h2 class="text-2xl font-bold text-center text-gray-900">Student Assignment Tracker</h2>
    <p class="text-sm text-center text-gray-500 mb-4">Manage and track your assignments easily</p>



    // error 
    <div id="error" class="hidden mb-4 p-3 text-sm text-red-700 bg-red-100 rounded">
      Invalid username or password
    </div>

   // login form
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Username</label>
        <input type="text" id="username" placeholder="Enter username"
          class="w-full px-4 py-3 bg-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-gray-900"
          required />
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">Password</label>
        <input type="password" id="password" placeholder="Enter password"
          class="w-full px-4 py-3 bg-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-gray-900"
          required />
      </div>

      <button type="submit"
        class="w-full py-3 bg-gray-900 text-white rounded hover:bg-gray-800 transition">
        Sign In
      </button>
    </form>

    // register
    <p class="mt-6 text-center text-sm">
      Not registered?
      <a href="register.html" class="font-bold text-gray-900 hover:underline">Create an account</a>
    </p>
  </div>

  // footer
  <footer class="mt-6 text-center text-xs text-gray-300">
    Student Assignment Tracker <span aria-hidden="true">&copy;</span> 2025 by Syamimi &amp; Amir | IMS566 Project
  </footer>

  <script src="app.js"></script>
  <script>
    // got to menu if already login
    if (window.SAT && SAT.getCurrentUser()) {
      window.location.href = "menu.html";
    }

    // prefill username from register 
    (function () {
      const params = new URLSearchParams(window.location.search);
      const u = params.get("u");
      if (u) document.getElementById("username").value = u;
    })();

    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");

    // hide error when typing
    document.getElementById("username").addEventListener("input", () => error.classList.add("hidden"));
    document.getElementById("password").addEventListener("input", () => error.classList.add("hidden"));

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const result = SAT.login(username, password);

      if (result.ok) {
        window.location.href = "menu.html";
      } else {
        error.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
