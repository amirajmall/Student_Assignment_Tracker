<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Assignment Tracker | Register</title>

  <link rel="stylesheet" href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-gray-900 to-gray-800 px-4">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-xl font-bold text-gray-800 text-center mb-2">Register</h1>
    <p class="text-sm text-gray-500 text-center mb-6"><i class="fas fa-user-plus mr-2"></i>Create your account</p>

    <div id="msg" class="hidden mb-4 p-3 text-sm rounded"></div>

    <form id="registerForm" class="space-y-4">
<div>
        <label class="block text-sm text-gray-600 mb-1">Email</label>
        <input id="email" type="email" placeholder="Your Email"
          class="w-full px-4 py-2 bg-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-gray-900"
          required />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Username</label>
          <input id="username" type="text" placeholder="Username"
            class="w-full px-4 py-2 bg-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-gray-900"
            required />
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">Password</label>
          <input id="password" type="password" placeholder="Min 4 characters"
            class="w-full px-4 py-2 bg-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-gray-900"
            required />
        </div>
      </div>
      <button type="submit"
        class="w-full py-3 bg-gray-900 text-white rounded hover:bg-gray-800 transition">
        Register
      </button>

      <a href="index.html" class="block text-sm font-bold text-center hover:underline">
        Already have an account?
      </a>
    </form>
  </div>

  <footer class="mt-6 text-center text-xs text-gray-300">
    Student Assignment Tracker <span aria-hidden="true">&copy;</span> 2025 by Syamimi &amp; Amir | IMS566 Project
  </footer>

  <script src="app.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const msg = document.getElementById("msg");

    function showMsg(text, type) {
      msg.classList.remove("hidden");
      msg.textContent = text;
      msg.className = "mb-4 p-3 text-sm rounded " + (type === "ok"
        ? "text-green-800 bg-green-100"
        : "text-red-800 bg-red-100");
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (password.length < 4) {
        showMsg("Password must be at least 4 characters.", "err");
        return;
      }
      const users = SAT.getUsers();
      const exists = users.some(u => u.username.toLowerCase() === username.toLowerCase());
      if (exists) {
        showMsg("Username already exists. Please choose another username.", "err");
        return;
      }

      users.push({
        id: SAT.uid(),
        email,
        username,
        password,
        createdAt: new Date().toISOString()
      });

      SAT.saveUsers(users);
      showMsg("Registration successful! Redirecting to login...", "ok");

      // back to login and refill username
      setTimeout(() => {
        window.location.href = "index.html?u=" + encodeURIComponent(username);
      }, 800);
    });
  </script>
</body>
</html>
