<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignments | Student Assignment Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS -->
  <link href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="sidebar.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-gray-800 font-sans">

  <!-- top nav -->
  <header class="fixed top-0 w-full bg-gray-800 z-20">
    <div class="flex items-center justify-between px-4 py-3 text-white">
      <h1 class="font-bold text-lg">Student Assignment Tracker</h1>
      <div class="flex items-center gap-3">
        <span id="greeting">Hello 👋</span>
        <button id="logoutBtn" class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600 text-sm">Logout</button>
      </div>
    </div>
  </header>

  <div class="flex pt-14">

    <nav class="sidebar">
      <a href="menu.html">
        <i class="fas fa-th-large"></i>
        <span>Menu</span>
      </a>

      <a href="dashboard.html">
        <i class="fas fa-tasks"></i>
        <span>Dashboard</span>
      </a>

      <a href="assignment.html" class="active">
        <i class="fas fa-paperclip"></i>
        <span>Assignments</span>
      </a>

      <a href="analytics.html">
        <i class="fas fa-chart-line"></i>
        <span>Analytics</span>
      </a>
    </nav>

    <!-- content -->
    <main class="flex-1 bg-gray-100 p-6">

      <div class="bg-gradient-to-r from-blue-900 to-gray-800 text-white p-4 rounded-lg mb-6">
        <h2 class="text-xl font-bold"><i class="fas fa-tasks mr-2"></i>Assignments</h2>
        <p class="text-sm text-gray-200">Add / Edit / Delete assignments</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

        <!-- form -->
        <section class="lg:col-span-4">
          <div class="bg-white rounded-lg shadow p-4">
            <h3 class="font-bold mb-3" id="formTitle">Add Assignment</h3>

            <form id="assignmentForm" class="space-y-3">
              <input type="hidden" id="editingId" />

              <div>
                <label class="block text-sm text-gray-600 mb-1">Title</label>
                <input id="title" class="w-full px-3 py-2 bg-gray-100 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600"
                       placeholder="Assignment title" required />
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Course</label>
                <input id="course" class="w-full px-3 py-2 bg-gray-100 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600"
                       placeholder="Course code" required />
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Due Date</label>
                <input id="dueDate" type="date" class="w-full px-3 py-2 bg-gray-100 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600" required />
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Status</label>
                <select id="status" class="w-full px-3 py-2 bg-gray-100 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
                  <option value="Not started">Not started</option>
                  <option value="In progress">In progress</option>
                  <option value="Done">Done</option>
                </select>
              </div>

              <div class="flex gap-2 pt-1">
                <button class="flex-1 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold" type="submit" id="saveBtn">Add</button>
                <button class="flex-1 py-2 rounded border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold" type="button" id="cancelEditBtn" hidden>Cancel</button>
              </div>
            </form>
          </div>
        </section>

        <!-- table -->
        <section class="lg:col-span-8">
          <div class="bg-white rounded-lg shadow p-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-3">
              <h3 class="font-bold">Assignment List</h3>
              <input id="search" class="w-full md:w-64 px-3 py-2 bg-gray-100 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600"
                     placeholder="Search title/course..." />
            </div>
