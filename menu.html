<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu | Student Assignment Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="sidebar.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>

<body class="bg-gray-800 font-sans">

  <header class="fixed top-0 w-full bg-gray-800 z-20">
    <div class="flex items-center justify-between px-4 py-3 text-white">
      <h1 class="font-bold text-lg">Student Assignment Tracker</h1>
      <div class="flex items-center gap-3">
        <span id="greeting">Hello 👋</span>
        <button id="logoutBtn" class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600 text-sm">Logout</button>
      </div>
    </div>
  </header>

  <div class="flex pt-14">

    <nav class="sidebar">
      <a href="menu.html" class="active">
        <i class="fas fa-th-large"></i>
        <span>Menu</span>
      </a>

      <a href="dashboard.html">
        <i class="fas fa-tasks"></i>
        <span>Dashboard</span>
      </a>

      <a href="assignment.html">
        <i class="fas fa-paperclip"></i>
        <span>Assignments</span>
      </a>

      <a href="analytics.html">
        <i class="fas fa-chart-line"></i>
        <span>Analytics</span>
      </a>
    </nav>

    <!-- menu content -->
    <main class="flex-1 bg-gray-100 p-6">
      <div class="bg-gradient-to-r from-blue-900 to-gray-800 text-white p-4 rounded-lg mb-6">
        <h2 class="text-xl font-bold"><i class="fas fa-th-large mr-2"></i>Menu</h2>
        <p class="text-sm text-gray-200">Choose a page to continue</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <a href="dashboard.html" class="bg-white p-5 rounded-lg shadow hover:shadow-md transition">
          <div class="flex items-center gap-3">
            <i class="fas fa-tasks text-blue-600 text-xl"></i>
            <div>
              <h3 class="font-bold">Dashboard</h3>
              <p class="text-sm text-gray-500">View summary & progress</p>
            </div>
          </div>
        </a>

        <a href="assignment.html" class="bg-white p-5 rounded-lg shadow hover:shadow-md transition">
          <div class="flex items-center gap-3">
            <i class="fas fa-paperclip text-green-600 text-xl"></i>
            <div>
              <h3 class="font-bold">Assignments</h3>
              <p class="text-sm text-gray-500">Add, edit, delete tasks</p>
            </div>
          </div>
        </a>

        <a href="analytics.html" class="bg-white p-5 rounded-lg shadow hover:shadow-md transition">
          <div class="flex items-center gap-3">
            <i class="fas fa-chart-line text-purple-600 text-xl"></i>
            <div>
              <h3 class="font-bold">Analytics</h3>
              <p class="text-sm text-gray-500">Overdue & status chart</p>
            </div>
          </div>
        </a>
      </div>

      <footer class="mt-10 border-t border-gray-200 pt-4 text-center text-sm text-gray-500">
        Student Assignment Tracker <span aria-hidden="true">&copy;</span> 2025 by Syamimi &amp; Amir | IMS566 Project
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    SAT.requireAuth();
  </script>
</body>
</html>
