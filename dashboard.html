<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Student Assignment Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS -->
  <link href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

  <!-- chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="sidebar.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>

<body class="bg-gray-800 font-sans">

  <!-- top nav -->
  <header class="fixed top-0 w-full bg-gray-800 z-20">
    <div class="flex items-center justify-between px-4 py-3 text-white">
      <h1 class="font-bold text-lg">Student Assignment Tracker</h1>
      <div class="flex items-center gap-3">
        <span id="greeting">Hello 👋</span>
        <button id="logoutBtn" class="px-3 py-1 rounded bg-gray-700 hover:bg-gray-600 text-sm">Logout</button>
      </div>
    </div>
  </header>

  <div class="flex pt-14">

    <nav class="sidebar">
      <a href="menu.html">
        <i class="fas fa-th-large"></i>
        <span>Menu</span>
      </a>

      <a href="dashboard.html" class="active">
        <i class="fas fa-tasks"></i>
        <span>Dashboard</span>
      </a>

      <a href="assignment.html">
        <i class="fas fa-paperclip"></i>
        <span>Assignments</span>
      </a>

      <a href="analytics.html">
        <i class="fas fa-chart-line"></i>
        <span>Analytics</span>
      </a>
    </nav>

    <!-- content -->
    <main class="flex-1 bg-gray-100 p-6">

      <div class="bg-gradient-to-r from-blue-900 to-gray-800 text-white p-4 rounded-lg mb-6">
        <h2 class="text-xl font-bold"><i class="fas fa-tachometer-alt mr-2"></i>Dashboard</h2>
        <p class="text-sm text-gray-200">Live data from your Assignments page</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white p-4 rounded shadow flex items-center justify-between">
          <div>
            <p class="text-gray-500 text-sm">Assignments</p>
            <h3 id="totalCount" class="text-2xl font-bold">0</h3>
          </div>
          <div class="h-10 w-10 rounded-lg bg-blue-100 flex items-center justify-center">
            <i class="fas fa-clipboard-list text-blue-700"></i>
          </div>
        </div>

        <div class="bg-white p-4 rounded shadow flex items-center justify-between">
          <div>
            <p class="text-gray-500 text-sm">Completed</p>
            <h3 id="doneCount" class="text-2xl font-bold">0</h3>
          </div>
          <div class="h-10 w-10 rounded-lg bg-green-100 flex items-center justify-center">
            <i class="fas fa-check-circle text-green-700"></i>
          </div>
        </div>

        <div class="bg-white p-4 rounded shadow flex items-center justify-between">
          <div>
            <p class="text-gray-500 text-sm">Pending</p>
            <h3 id="pendingCount" class="text-2xl font-bold">0</h3>
          </div>
          <div class="h-10 w-10 rounded-lg bg-yellow-100 flex items-center justify-center">
            <i class="fas fa-hourglass-half text-yellow-700"></i>
          </div>
        </div>
      </div>

      <!-- chart -->
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold mb-1"><i class="fas fa-chart-pie mr-2"></i>Status Summary</h3>
        <p class="text-sm text-gray-500 mb-4">Not started vs In progress vs Done</p>
        <canvas id="statusChart"></canvas>
      </div>

      <footer class="mt-10 border-t border-gray-200 pt-4 text-center text-sm text-gray-500">
        Student Assignment Tracker <span aria-hidden="true">&copy;</span> 2025 by Syamimi &amp; Amir | IMS566 Project
      </footer>

    </main>
  </div>

  <script src="app.js"></script>
  <script>
    SAT.requireAuth();

    const items = SAT.getAssignments();
    const total = items.length;
    const counts = SAT.getStatusCounts(items);
    const done = counts.done;
    const pending = total - done;

    document.getElementById("totalCount").textContent = total;
    document.getElementById("doneCount").textContent = done;
    document.getElementById("pendingCount").textContent = pending;

    const ctx = document.getElementById("statusChart");
    new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Not started", "In progress", "Done"],
        datasets: [{
          label: "Assignments",
          data: [counts.notStarted, counts.inProgress, counts.done],
          backgroundColor: [
            "rgba(107,114,128,0.6)",
            "rgba(245,158,11,0.6)",
            "rgba(34,197,94,0.6)"
          ]
        }]
      },
      options: {
        responsive: true,
        scales: { y: { beginAtZero: true, precision: 0 } }
      }
    });
  </script>
</body>
</html>
